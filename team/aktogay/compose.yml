# Overlay on the OpenEgiz Compose deployment. Start through `make aktogay`.
services:
  aktogay-setup:
    # Paths in an overlay are resolved against deploy/compose/docker-compose.yml.
    build: ../../team/aktogay
    image: openegiz/aktogay-mine:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  aktogay-mine:
    image: openegiz/aktogay-mine:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      AKTOGAY_MODE: integrated
      SIM_SPEEDUP: "60"
      SIM_SEED: "64"
      WEB_PORT: "8088"
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:${AKTOGAY_PORT:-8091}:8088"
    depends_on:
      aktogay-setup:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  grafana:
    volumes:
      - ../../team/aktogay/dashboard.json:/var/lib/grafana/example-dashboards/aktogay-mine.json:ro
